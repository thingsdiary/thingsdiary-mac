name: Release DMG

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Apple Silicon DMG
        run: ./scripts/build-dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" .build/release/thingsdiary.dmg --clobber
          else
            gh release create "${GITHUB_REF_NAME}" .build/release/thingsdiary.dmg --generate-notes --verify-tag
          fi
